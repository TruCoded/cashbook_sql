<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cashbook - My Accounts</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="cashbooks.css" />
  <script src="theme.js"></script>
  <!-- Vercel Web Analytics & Speed Insights -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };</script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <div class="page">
    <!-- Topbar Profile & Controls -->
    <div class="topbar">
      <div class="user-profile-row">
        <div class="user-avatar" id="userAvatar">U</div>
        <div>
          <div class="greeting-text">Welcome back,</div>
          <div class="user-name-title" id="userName">User</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">☀️</button>
        <a href="login.html" class="theme-toggle-btn" onclick="localStorage.clear()" title="Sign Out" style="text-decoration:none;">⏻</a>
      </div>
    </div>

    <!-- Total Balance Hero Card -->
    <div class="hero-balance-card">
      <div class="hero-balance-label">
        <span>Total Net Balance</span>
        <span style="font-size:11px;opacity:0.8;">LIVE</span>
      </div>
      <div class="hero-balance-val" id="totalNetBalance">₹0.00</div>
      <div class="hero-balance-chip">
        <span>↑</span>
        <span id="cashbookCount">0 Cashbooks</span>
      </div>

      <!-- Fintech Wave SVG -->
      <svg class="hero-sparkline" viewBox="0 0 500 60" fill="none" preserveAspectRatio="none">
        <path d="M0 45 Q 60 20, 120 35 T 240 15 T 360 40 T 440 10 T 500 25" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M0 45 Q 60 20, 120 35 T 240 15 T 360 40 T 440 10 T 500 25 L 500 60 L 0 60 Z" fill="url(#sparklineGrad)" opacity="0.25"/>
        <defs>
          <linearGradient id="sparklineGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- Quick Action Pills -->
    <div class="action-grid">
      <a href="add-cashbook.html" class="action-btn-item">
        <div class="action-icon-circle">＋</div>
        <span>New Book</span>
      </a>
      <a href="analytics.html" class="action-btn-item">
        <div class="action-icon-circle">📈</div>
        <span>Analytics</span>
      </a>
      <a href="collaborators.html" class="action-btn-item">
        <div class="action-icon-circle">👥</div>
        <span>Team</span>
      </a>
      <a href="superadmin.html" class="action-btn-item">
        <div class="action-icon-circle">📊</div>
        <span>Admin</span>
      </a>
    </div>

    <!-- Cashbooks List Header -->
    <div class="section-header">
      <h3 class="section-title">My Cashbooks</h3>
      <a href="add-cashbook.html" class="section-link">+ Create New</a>
    </div>

    <div id="list"></div>
  </div>

  <!-- Mobile Floating + Button -->
  <button class="fab" onclick="location.href='add-cashbook.html'" title="Create Cashbook">+</button>

  <script src="cashbooks.js"></script>
</body>
</html>
