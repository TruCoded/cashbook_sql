services:
  - type: web
    name: cashbook-sql
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: cashbook
      - key: GOOGLE_CLIENT_ID
        sync: false
