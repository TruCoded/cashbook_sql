<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Cashbook - Sign Up</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="signup.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Vercel Web Analytics & Speed Insights -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };</script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <div class="page" style="display:flex;flex-direction:column;justify-content:center;min-height:100vh;">
    <p class="script" style="text-align:center;margin-bottom:-6px;">Join</p>
    <h1 style="text-align:center;margin-top:0;">MY CASHBOOK</h1>
    <p style="text-align:center;color:var(--navy);margin-bottom:32px;">Create an account to start tracking</p>

    <div class="card">
      <!-- Google fills this with its own "Sign up with Google" button (see signup.js).
           One tap creates the account AND logs in - no password to choose at all. -->
      <div id="google-btn" style="display:flex;justify-content:center;margin-bottom:6px;"></div>
      <p class="or-divider">or sign up with email</p>

      <label for="name">Name</label>
      <input id="name" placeholder="Your name" />

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Choose a password" />

      <p id="err" class="error"></p>
      <button class="btn full" onclick="signup()">Sign Up</button>
    </div>

    <p class="auth-switch">Already have an account? <a href="login.html">Sign In</a></p>
  </div>
  <script src="signup.js"></script>
</body>
</html>
