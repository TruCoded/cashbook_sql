<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cashbook - Details</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="cashbook-detail.css" />
  <script src="theme.js"></script>
  <!-- Vercel Web Analytics & Speed Insights -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };</script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <div class="page">
    <!-- Header -->
    <div class="topbar">
      <a href="cashbooks.html" class="link-back" style="margin-bottom:0;">← Back</a>
      <div class="header-actions">
        <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">☀️</button>
      </div>
    </div>

    <!-- Title & Nominee Info -->
    <div style="margin-bottom: 18px;">
      <h2 id="title" style="font-size:24px;margin-bottom:4px;">Cashbook</h2>
      <p id="partnerBadge" style="font-size:12px;color:var(--text-secondary);margin:0;display:none;"></p>
    </div>

    <!-- Total Balance Hero Card -->
    <div class="hero-balance-card">
      <div class="hero-balance-label">
        <span>Available Balance</span>
        <span style="font-size:11px;opacity:0.8;">LEDGER</span>
      </div>
      <div class="hero-balance-val" id="balance">₹0.00</div>

      <svg class="hero-sparkline" viewBox="0 0 500 60" fill="none" preserveAspectRatio="none">
        <path d="M0 50 Q 80 15, 160 40 T 320 20 T 480 30" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M0 50 Q 80 15, 160 40 T 320 20 T 480 30 L 500 60 L 0 60 Z" fill="url(#sparklineGradDetail)" opacity="0.25"/>
        <defs>
          <linearGradient id="sparklineGradDetail" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
          </linearGradient>
        </defs>
      </svg>

      <div class="stat-grid">
        <div class="stat-pill">
          <div class="stat-icon in">↓</div>
          <div class="stat-content">
            <div class="stat-label">Total In</div>
            <div class="stat-amount" id="cashIn">₹0.00</div>
          </div>
        </div>
        <div class="stat-pill">
          <div class="stat-icon out">↑</div>
          <div class="stat-content">
            <div class="stat-label">Total Out</div>
            <div class="stat-amount" id="cashOut">₹0.00</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Transaction Card (Fintech Segmented Control) -->
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <span style="font-size:14px;font-weight:700;color:var(--text-primary);">New Transaction</span>
        <span style="font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;">Instant Entry</span>
      </div>

      <!-- Segmented Buttons -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
        <button id="btnTypeIn" type="button" class="btn" style="background:var(--accent-green-bg);color:var(--accent-green);border:1px solid rgba(16,185,129,0.3);box-shadow:none;padding:10px;" onclick="setEntryType('in')">
          ↓ Cash In
        </button>
        <button id="btnTypeOut" type="button" class="btn secondary" style="padding:10px;" onclick="setEntryType('out')">
          ↑ Cash Out
        </button>
      </div>

      <input type="hidden" id="txnType" value="in" />

      <label for="txnAmount">Amount (₹)</label>
      <input id="txnAmount" type="number" step="any" placeholder="0.00" style="font-size:18px;font-weight:700;" />

      <label for="txnNote">Note / Description</label>
      <input id="txnNote" placeholder="e.g. Salary, Groceries, Rent, Coffee" />

      <button class="btn full" onclick="addTransaction()">+ Record Entry</button>
    </div>

    <!-- Recent Transactions Section -->
    <div class="section-header">
      <h3 class="section-title">Recent Transactions</h3>
      <span id="txnCountBadge" style="font-size:12px;color:var(--text-secondary);font-weight:600;">0 entries</span>
    </div>

    <div id="txnList">
      <div class="card" style="text-align:center;color:var(--text-secondary);padding:24px;">No transactions recorded yet.</div>
    </div>

    <!-- Add Collaborator Card -->
    <div class="section-header" style="margin-top:32px;">
      <h3 class="section-title">Invite Collaborator</h3>
    </div>

    <div class="card">
      <label for="collabEmail">Collaborator Gmail / Email</label>
      <input id="collabEmail" type="email" placeholder="partner@example.com" />
      <button class="btn full secondary" onclick="requestOtp()">Send Verification OTP</button>

      <div id="otpStep" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--surface-border);">
        <label for="otpCode">Enter 6-Digit OTP</label>
        <input id="otpCode" placeholder="123456" maxlength="6" />

        <label for="accNum">Bank Account Number (Optional)</label>
        <input id="accNum" placeholder="Account Number" />

        <label for="ifsc">IFSC Code (Optional)</label>
        <input id="ifsc" placeholder="e.g. HDFC0001234" />

        <p id="collabErr" class="error"></p>
        <button class="btn full" onclick="verifyAndAdd()">Verify &amp; Add Collaborator</button>
      </div>
    </div>
  </div>

  <script src="cashbook-detail.js"></script>
</body>
</html>
