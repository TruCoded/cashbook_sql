<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cashbook - Login</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="login.css" />
  <script src="theme.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Vercel Web Analytics & Speed Insights -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };</script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <div class="page" style="justify-content:center;">
    <!-- Theme Toggle at top right -->
    <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
      <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">☀️</button>
    </div>

    <!-- Brand Header -->
    <div style="text-align:center;margin-bottom:30px;">
      <div style="width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:inline-flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 8px 24px var(--accent-purple-glow);margin-bottom:14px;">
        💳
      </div>
      <h1 style="font-size:28px;font-weight:800;letter-spacing:-0.03em;margin-bottom:6px;">My Cashbook</h1>
      <p style="color:var(--text-secondary);font-size:14px;margin:0;">Smart financial ledger with multi-party tracking</p>
    </div>

    <!-- Login Card -->
    <div class="card" style="padding:28px 22px;">
      <!-- Google Sign In -->
      <div id="google-btn" style="display:flex;justify-content:center;margin-bottom:8px;"></div>
      <div class="or-divider">or sign in with email</div>

      <label for="email">Email Address</label>
      <input id="email" type="email" placeholder="you@example.com" value="trusha@example.com" />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" value="trusha123" />

      <p id="err" class="error"></p>
      <button class="btn full" onclick="login()">Sign In →</button>
    </div>

    <p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>
  </div>
  <script src="login.js"></script>
</body>
</html>
