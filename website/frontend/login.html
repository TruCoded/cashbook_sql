<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cashbook - Login</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="login.css" />
  <script src="theme.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Vercel Web Analytics & Speed Insights -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };</script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <style>
    .auth-fullscreen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
    }
    .auth-card-wrap {
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
      padding-top: 20px;
    }
    .logo-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-img {
      height: 48px;
      width: auto;
      filter: var(--logo-filter);
      margin-bottom: 12px;
      transition: filter 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="auth-fullscreen">
    <!-- Top Bar with Theme Toggle -->
    <div style="display:flex;justify-content:space-between;align-items:center;max-width:1240px;width:100%;margin:0 auto;">
      <a href="#" class="brand-logo-wrap">
        <img src="logo.png" class="brand-logo-img" alt="Cashbook" />
      </a>
      <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">☀️</button>
    </div>

    <!-- Centered Login Box -->
    <div class="auth-card-wrap">
      <div class="logo-header">
        <h1 style="font-size:30px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;color:var(--text-primary);">Welcome Back</h1>
        <p style="color:var(--text-secondary);font-size:14px;margin:0;">Fast, modern multi-party cashbook ledger</p>
      </div>

      <div class="card" style="padding:32px 26px;">
        <!-- Google Sign-In -->
        <div id="google-btn" style="display:flex;justify-content:center;margin-bottom:8px;"></div>
        <div class="or-divider">or sign in with email</div>

        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="you@example.com" value="trusha@example.com" />

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" value="trusha123" />

        <p id="err" class="error"></p>
        <button class="btn full" onclick="login()">Sign In →</button>
      </div>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Create one here</a></p>
    </div>

    <!-- Clean Footer -->
    <div style="text-align:center;font-size:12px;color:var(--text-muted);padding:16px 0;">
      © 2026 My Cashbook. Secure financial intelligence.
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
